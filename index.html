<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

<title>Oxygen Tank Duration Calculator</title>

<!-- iOS Icons -->
<link rel="apple-touch-icon" sizes="180x180" href="ventcalc_icons/icon-180.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VentCalc">

<style>

/* ===== Global Scaling Fix ===== */
html {
  font-size: 92%;
}

* {
  box-sizing: border-box;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f8f8f8;
  margin: 0;
  padding: 0;
  font-size: 1rem;
}

/* ===== Container ===== */

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 1.2rem;
}

/* ===== Header ===== */

header {
  text-align: center;
  margin-bottom: 1.2rem;
}

/* Header Image */
header img {
  width: 100%;
  max-height: 160px;
  object-fit: contain;
  margin-bottom: 0.8rem;
}

/* Title */
header h1 {
  margin: 0;
  font-size: 1.8rem;
  color: #333;
}

/* Subtitle */
.subtitle {
  font-size: 0.95rem;
  color: #777;
}

/* ===== Input Section ===== */

.input-section {
  background: #fff;
  padding: 1.4rem;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* Labels */
.input-section label {
  display: block;
  margin-top: 0.8rem;
  font-weight: 600;
  color: #333;
  font-size: 1rem;
}

/* Inputs */
.input-section input {
  width: 100%;
  padding: 0.75rem;
  font-size: 1rem;
  border: 2px solid #666;
  border-radius: 8px;
  margin-top: 0.35rem;
  background: #fafafa;
}

/* Focus */
.input-section input:focus {
  outline: none;
  border-color: #007aff;
  background: #fff;
}

/* ===== Button ===== */

button {
  margin-top: 1.4rem;
  width: 100%;
  padding: 0.9rem;
  font-size: 1.1rem;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  transition: background 0.2s;
}

button:hover {
  background: #005bb5;
}

/* ===== Results ===== */

.result-section {
  background: #eaf5ea;
  margin-top: 1.3rem;
  padding: 1.4rem;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

.result-section h2 {
  margin-top: 0;
  color: #2b5d2e;
  font-size: 1.3rem;
}

/* ===== Footer ===== */

footer {
  text-align: center;
  margin-top: 1.8rem;
  font-size: 0.9rem;
  color: #aaa;
}

</style>
</head>

<body>

<div class="container">

<header>

  <!-- Header Image -->
  <img src="life support airplane.png" alt="Life Support">

  <h1>Oxygen Tank Duration Calculator</h1>

  <div class="subtitle">
    Portable Oxygen Duration Estimator
  </div>

</header>


<!-- ===== Input Section ===== -->

<div class="input-section">

  <label>Minute Ventilation (L/min)</label>
  <input type="number" id="minuteVentilation" step="0.01">

  <label>Leak (L/min)</label>
  <input type="number" id="leak" step="0.01">

  <label>Bias Flow (L/min)</label>
  <input type="number" id="biasFlow" step="0.01">

  <label>Hours to Ventilate</label>
  <input type="number" id="hours" step="0.01">

  <label>FiO₂ (%)</label>
  <input type="number" id="fio2" min="20.9" max="100" step="0.1">

  <button onclick="calculate()">Calculate</button>

</div>


<!-- ===== Results ===== -->

<div class="result-section" id="results" style="display:none;">

  <h2>Results</h2>

  <p><strong>Litres / Minute:</strong>
     <span id="litresPerMinute"></span></p>

  <p><strong>Total Litres:</strong>
     <span id="totalLitres"></span></p>

  <p><strong>Recommended Tank:</strong>
     <span id="tankSize"></span></p>

  <p><strong>Extra Litres:</strong>
     <span id="extraLitres"></span></p>

</div>


<footer>
  VentCalc PWA
</footer>

</div>


<!-- ===== Script ===== -->

<script>

const tankSizes = [
  { name: "D", value: 425 },
  { name: "E", value: 680 },
  { name: "M60", value: 1738 },
  { name: "M/MM/M122", value: 3455 },
  { name: "H/K", value: 7080 }
];

function calculate() {

  const minuteVent = parseFloat(document.getElementById("minuteVentilation").value) || 0;
  const leak = parseFloat(document.getElementById("leak").value) || 0;
  const biasFlow = parseFloat(document.getElementById("biasFlow").value) || 0;
  const hours = parseFloat(document.getElementById("hours").value) || 0;
  const fio2 = parseFloat(document.getElementById("fio2").value) || 20.9;

  const litresPerMinute =
    ((fio2 - 20.9) / 79.1) *
    (minuteVent + leak + biasFlow);

  const totalLitres =
    litresPerMinute * hours * 60;


  document.getElementById("litresPerMinute").innerText =
    litresPerMinute.toFixed(2);

  document.getElementById("totalLitres").innerText =
    totalLitres.toFixed(2);


  let selectedTank = "None";
  let selectedValue = 0;

  for (let tank of tankSizes) {
    if (totalLitres <= tank.value) {
      selectedTank = tank.name;
      selectedValue = tank.value;
      break;
    }
  }

  const extra =
    selectedValue ? selectedValue - totalLitres : 0;


  document.getElementById("tankSize").innerText =
    selectedTank;

  document.getElementById("extraLitres").innerText =
    extra.toFixed(2);


  document.getElementById("results").style.display = "block";
}

</script>

</body>
</html>
