<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Oxygen Tank Duration Calculator</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VentCalc">

<style>

/* Base scaling (UNCHANGED) */
html {
  font-size: 100%;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f8f8f8;
  margin: 0;
  padding: 0;
  font-size: 1rem;
}

.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 1.5rem;
}

/* Header image */
.header-image {
  width: 100%;
  max-height: 180px;
  object-fit: cover;
  border-radius: 12px;
  margin-bottom: 1rem;
}

/* Title */
h1 {
  text-align: center;
  font-size: 2rem;
  color: #333;
  margin-bottom: 1rem;
}

/* Input section */
.input-section {
  background: #fff;
  padding: 1.5rem;
  border-radius: 0.75rem;
  box-shadow: 0 0.125rem 0.375rem rgba(0,0,0,0.1);
}

label {
  display: block;
  margin-top: 0.75rem;
  font-weight: 600;
  color: #333;
}

input {
  width: 100%;
  padding: 0.75rem;
  font-size: 1rem;
  border: 2px solid #666;
  border-radius: 0.5rem;
  margin-top: 0.3rem;
}

input:focus {
  outline: none;
  border-color: #007aff;
  box-shadow: 0 0 4px rgba(0,122,255,0.5);
}

/* Buttons */
.button-row {
  display: flex;
  justify-content: space-between;
  margin-top: 1.25rem;
}

button {
  width: 48%;
  padding: 1rem;
  font-size: 1.1rem;
  background: #007aff;
  color: #fff;
  border: none;
  border-radius: 0.75rem;
  cursor: pointer;
}

button:hover {
  background: #005bb5;
}

.reset-btn {
  background: #6c757d;
}

.reset-btn:hover {
  background: #555;
}

/* Results */
#results {
  background: #eaf5ea;
  margin-top: 1.25rem;
  padding: 1.5rem;
  border-radius: 0.75rem;
  box-shadow: 0 0.125rem 0.375rem rgba(0,0,0,0.1);
  display: none;
}

#results h2 {
  margin-top: 0;
  color: #2b5d2e;
}

#customTanksSelection {
  background: #e0e7ff;
  margin-top: 1rem;
  padding: 1rem;
  border-radius: 0.75rem;
  display: none;
}

/* Tank buttons */
.tank-row {
  display: flex;
  align-items: center;
  margin-bottom: 8px;
}

.tank-name {
  width: 120px;
  font-weight: bold;
}

.tank-buttons label {
  display: inline-block;
  width: 30px;
  height: 30px;
  margin-right: 5px;
  line-height: 30px;
  text-align: center;
  border: 1px solid #666;
  border-radius: 4px;
  cursor: pointer;
}

.tank-buttons label.selected {
  background: #007aff;
  color: #fff;
}

/* Debug */
#debug {
  margin-top: 20px;
  background: #222;
  color: #0f0;
  padding: 10px;
  font-family: monospace;
  border-radius: 8px;
  max-height: 200px;
  overflow-y: auto;
  font-size: 0.85rem;
}

</style>
</head>

<body>

<div class="container">

<!-- HEADER IMAGE -->
<img src="header.png" class="header-image" alt="life support">

<h1>Oxygen Tank Duration Calculator</h1>

<div class="input-section">

<label>Minute Ventilation (L/min)</label>
<input type="number" id="minuteVentilation" step="0.01">

<label>Leak (L/min)</label>
<input type="number" id="leak" step="0.01">

<label>Bias Flow (L/min)</label>
<input type="number" id="biasFlow" step="0.01">

<label>Hours to Ventilate</label>
<input type="number" id="hours" step="0.01">

<label>FiO₂ (%)</label>
<input type="number" id="fio2" step="0.1" min="20.9" max="100">

<div class="button-row">
  <button onclick="calculate()">Calculate</button>
  <button class="reset-btn" onclick="resetForm()">Reset</button>
</div>

</div>


<!-- RESULTS -->
<div id="results">

<h2>Results</h2>

<p><strong>Litres per Minute:</strong> <span id="litresPerMinute"></span> L/min</p>

<p><strong>Total Litres:</strong> <span id="totalLitres"></span> L</p>

<p><strong>Recommended Tank:</strong> <span id="tankSize"></span></p>

<p><strong>Extra Litres Left:</strong> <span id="extraLitres"></span> L</p>

<p id="alertMessage" style="color:red;font-weight:bold;"></p>

<p id="twoTanksOption" style="font-weight:bold;"></p>

</div>


<!-- CUSTOM TANKS -->
<div id="customTanksSelection">

<h3>Select Tanks (up to 3)</h3>

<div id="tankList"></div>

<div>
Total Combined Litres:
<span id="combinedLitres">0</span> L
</div>

<div id="volumeCheckMessage"></div>

</div>


<div id="debug">Debug Output:</div>

</div>


<script>

/* Tank data */

const tankSizes = [
  { name: "D", value: 425 },
  { name: "E", value: 680 },
  { name: "M60", value: 1738 },
  { name: "M/MM/M122", value: 3455 },
  { name: "H/K", value: 7080 }
];

let selectedTanks = [];
let totalLitresRequired = 0;


/* Debug */

function logDebug(msg) {
  const box = document.getElementById("debug");
  box.textContent += "\n" + msg;
  console.log(msg);
}


/* Build tank buttons */

function generateTankCheckboxes() {

  const div = document.getElementById("tankList");
  div.innerHTML = "";

  tankSizes.forEach(tank => {

    const row = document.createElement("div");
    row.className = "tank-row";

    const name = document.createElement("div");
    name.className = "tank-name";
    name.textContent = `${tank.name} (${tank.value} L)`;

    row.appendChild(name);

    const btns = document.createElement("div");
    btns.className = "tank-buttons";

    for (let i=0;i<3;i++) {

      const label = document.createElement("label");
      label.textContent = "x";

      label.dataset.name = tank.name;
      label.dataset.value = tank.value;

      label.onclick = toggleTank;

      btns.appendChild(label);
    }

    row.appendChild(btns);
    div.appendChild(row);

  });
}


/* Toggle tanks */

function toggleTank(e) {

  const label = e.target;

  const tank = {
    name: label.dataset.name,
    value: parseFloat(label.dataset.value),
    label: label
  };

  const exists = selectedTanks.find(t=>t.label===label);

  if (exists) {

    selectedTanks = selectedTanks.filter(t=>t.label!==label);
    label.classList.remove("selected");

  } else {

    if (selectedTanks.length>=3) {
      alert("Max 3 tanks");
      return;
    }

    selectedTanks.push(tank);
    label.classList.add("selected");
  }

  updateTankDisplay();
}


/* Update tanks */

function updateTankDisplay() {

  const total = selectedTanks.reduce((s,t)=>s+t.value,0);

  document.getElementById("combinedLitres").innerText =
    total.toFixed(2);

  const msg = document.getElementById("volumeCheckMessage");

  if (totalLitresRequired>0) {

    if (total>=totalLitresRequired) {

      const rem = total-totalLitresRequired;

      msg.style.color="green";
      msg.innerText =
      `Enough with ${rem.toFixed(2)} L remaining`;

    } else {

      msg.style.color="red";
      msg.innerText="Not enough volume";

    }

  } else {

    msg.innerText="";

  }
}


/* Calculate */

function calculate() {

  const minute =
    parseFloat(minuteVentilation.value)||0;

  const leak =
    parseFloat(leak.value)||0;

  const bias =
    parseFloat(biasFlow.value)||0;

  const hours =
    parseFloat(hours.value)||0;

  const fio2 =
    parseFloat(fio2.value)||20.9;


  const lpm =
   ((fio2-20.9)/79.1)*
   (minute+leak+bias);

  const total =
    lpm*hours*60;

  totalLitresRequired = total;


  litresPerMinute.innerText =
    lpm.toFixed(2);

  totalLitres.innerText =
    total.toFixed(2);


  let best="None";
  let bestVal=0;

  for (let t of tankSizes) {

    if (total<=t.value) {
      best=t.name;
      bestVal=t.value;
      break;
    }
  }


  const extra =
    bestVal?bestVal-total:0;


  tankSize.innerText = best;
  extraLitres.innerText = extra.toFixed(2);


  alertMessage.innerText =
    bestVal?"":"WARNING: Too large";


  let two="";

  if (bestVal) {

    const idx =
      tankSizes.findIndex(t=>t.name===best);

    for (let i=0;i<idx;i++) {

      if (tankSizes[i].value*2>=total) {

        const spare =
         tankSizes[i].value*2-total;

        two =
        `Two ${tankSizes[i].name} tanks give ${spare.toFixed(2)} L spare`;

        break;
      }
    }
  }

  twoTanksOption.innerText = two;

  results.style.display="block";


  selectedTanks=[];
  document
    .querySelectorAll(".tank-buttons label")
    .forEach(l=>l.classList.remove("selected"));

  updateTankDisplay();

  customTanksSelection.style.display =
    total?"block":"none";


  logDebug("Calculated");

}


/* RESET (RESTORED) */

function resetForm() {

  ["minuteVentilation","leak","biasFlow","hours","fio2"]
  .forEach(id=>document.getElementById(id).value="");


  results.style.display="none";

  litresPerMinute.innerText="";
  totalLitres.innerText="";
  tankSize.innerText="";
  extraLitres.innerText="";
  alertMessage.innerText="";
  twoTanksOption.innerText="";


  selectedTanks=[];

  document
    .querySelectorAll(".tank-buttons label")
    .forEach(l=>l.classList.remove("selected"));

  updateTankDisplay();


  combinedLitres.innerText="0";
  volumeCheckMessage.innerText="";
  customTanksSelection.style.display="none";


  debug.textContent="Debug Output:";

}


window.onload = generateTankCheckboxes;

</script>

</body>
</html>
